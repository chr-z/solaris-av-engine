name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Publish (wrangler pages deploy)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://solaris.chr-z.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle signing-material guard (SOLA-34)
        run: node scripts/check_bundle_secrets.mjs dist

      - name: Bundle guard self-test (SOLA-34 R-01)
        run: node scripts/check_bundle_secrets.mjs --self-test

      - name: Security headers guard (SOLA-35)
        run: node scripts/check-dist-security.mjs dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=solaris --branch=main --commit-dirty=true

      - name: Verify production URL and security surface (SOLA-35)
        run: |
          sleep 20
          base=https://solaris.chr-z.dev

          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/")
          echo "GET / -> $code"
          test "$code" = "200"

          headers=$(curl -sS -D - -o /dev/null "$base/")
          for h in content-security-policy strict-transport-security x-frame-options; do
            echo "$headers" | grep -qi "^$h:" || { echo "FAIL: missing $h on /"; exit 1; }
          done
          echo "$headers" | grep -qi "frame-ancestors 'none'" || { echo "FAIL: CSP lacks frame-ancestors"; exit 1; }
          echo "$headers" | grep -qi "unsafe-eval" && { echo "FAIL: CSP grants unsafe-eval"; exit 1; } || true

          # /api/* must never answer with the SPA shell + 200. The probe path is
          # unauthenticated so this stays a pure routing assertion: unlike
          # /api/get-sheets-data (which correctly authenticates first and returns
          # a JSON 401 — the SOLA-34 run failed the deploy on that by mistake),
          # an unknown /api/* path must return JSON 404, never index.html.
          # `-w '%{content_type}'` reports the type with no per-header dependency,
          # so this does not hinge on a proxy forwarding a header prefix.
          api_probe=$(curl -sS -o /tmp/api_body -w '%{http_code} %{content_type}' \
            "$base/api/__deploy_guard_probe__")
          echo "/api/__deploy_guard_probe__ -> $api_probe"
          case "$api_probe" in
            *application/json*) : ;;
            *) echo "FAIL: an unknown /api/* path did not return JSON (Pages Functions not deployed?)"; exit 1 ;;
          esac
          if grep -qi "<!DOCTYPE html>" /tmp/api_body; then echo "FAIL: /api returned the SPA shell"; exit 1; fi

          # SOLA-34: the licensing backend must be reachable and durable-ready.
          # A missing endpoint used to answer 405 (identical to a bogus path).
          lic=$(curl -sS -o /tmp/lic_body -w '%{http_code} %{content_type}' \
            -X POST -H 'content-type: application/json' -d '{"token":"x"}' \
            "$base/api/license/activate")
          echo "/api/license/activate -> $lic"
          case "$lic" in
            *application/json*) : ;;
            *) echo "FAIL: /api/license/activate is not JSON (backend not deployed?)"; exit 1 ;;
          esac
          if grep -qi "<!DOCTYPE html>" /tmp/lic_body; then echo "FAIL: activate returned the SPA shell"; exit 1; fi
          if grep -q "license_store_unconfigured" /tmp/lic_body; then
            echo "FAIL: SOLARIS_LICENSE_KV binding is not configured on the Pages project"; exit 1
          fi
          if grep -q "signer_not_configured" /tmp/lic_body; then
            echo "WARN: licence signer not configured yet — happy path cannot be issued"; :
          fi

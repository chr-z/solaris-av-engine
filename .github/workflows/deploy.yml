name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Publish (wrangler pages deploy)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://solaris.chr-z.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=solaris --branch=main --commit-dirty=true

      - name: Verify production URL
        run: |
          sleep 20
          code=$(curl -s -o /dev/null -w '%{http_code}' https://solaris.chr-z.dev/)
          echo "GET https://solaris.chr-z.dev/ -> $code"
          test "$code" = "200"

name: CI

on:
  push:
    branches: [main, v2-upgrade]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (tracked tree)
        # SOLA-142: pattern set lives in scripts/check_tracked_secrets.mjs
        # (identical to the inline grep this replaces — nothing weakened).
        # The bundle guard's own deliberate PEM generator lines are covered
        # by a narrow reviewed allowlist in that script, keyed by file path
        # AND fixture marker. Never a blanket suppression.
        run: node scripts/check_tracked_secrets.mjs

      - name: Lint changed files (incremental ratchet)
        run: |
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~10)
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- 'src/**/*.ts' 'src/**/*.tsx')
          CHANGED=$(printf '%s' "$CHANGED" | tr '\n' ' ')
          # NOTE: -n "$CHANGED" must quote the variable DIRECTLY. Escaped quotes
          # ("$CHANGED") made this guard always true, and a bare `npx eslint`
          # (no args) lints the entire tree — breaking main-only pushes.
          if [ -n "$CHANGED" ]; then
            echo "Linting: $CHANGED"
            npx eslint $CHANGED --max-warnings 0
          else
            echo "No changed TS files to lint."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle signing-material guard (SOLA-34)
        run: node scripts/check_bundle_secrets.mjs dist

      - name: Bundle guard self-test (SOLA-34 R-01)
        run: node scripts/check_bundle_secrets.mjs --self-test
